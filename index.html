<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#36091f">
  <title>Flores Amarillas 💛</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="background-hearts" aria-hidden="true"><span>♡</span><span>♡</span><span>♡</span><span>♡</span><span>♡</span><span>♡</span></div>
  <main class="card" id="card">
    <section class="scene" aria-label="Un árbol de girasoles en forma de corazón">
      <canvas id="treeCanvas" role="img" aria-label="Animación: una semilla crece hasta convertirse en un árbol de flores amarillas"></canvas>
      <button class="start" id="start" aria-label="Pulsa para plantar tu girasol">
        <img src="assets/girasol.png" alt="Girasol amarillo" width="120" height="120">
        <span>Flores para ti<small>Haz clic en el girasol</small></span>
      </button>
      <button class="replay" id="replay" hidden>↻ Volver a florecer</button>
    </section>
    <section class="left-content" id="letter" inert aria-hidden="true">
      <div class="eyebrow">UN PEQUEÑO DETALLE PARA TI MY LOVE</div>
      <div class="letter-box" id="typewriter-text"></div>
      <div class="counter-box">
        <p class="counter-title">Mi amor por ti comenzó hace…</p>
        <div class="timer-display"><span id="days">0</span> días<br><span id="hours">00</span> horas · <span id="minutes">00</span> minutos · <span id="seconds">00</span> segundos</div>
      </div>
    </section>
    <p class="sr-only" id="status" role="status" aria-live="polite">Pulsa el girasol para comenzar.</p>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
